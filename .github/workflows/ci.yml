name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        # Ключ API не нужен: тесты не обращаются к модели,
        # но конструктор генератора требует непустое значение.
        env:
          ANTHROPIC_API_KEY: ci-placeholder
        run: pytest
