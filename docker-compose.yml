services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Нужен только преподавателю для генерации: тест работает на готовом банке
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Локально — обычный HTTP, а кука с флагом Secure по нему не ходит
      # (исключение — сам localhost в современных браузерах)
      - RULEX_COOKIE_SECURE=0
    volumes:
      # Том смонтирован туда, где реально лежит questions.db.
      # Словари остаются в образе (/app/data) и томом не перекрываются.
      - rulex_var:/app/var
    restart: unless-stopped

volumes:
  rulex_var:
