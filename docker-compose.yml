services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Том смонтирован туда, где реально лежит questions.db.
      # Словари остаются в образе (/app/data) и томом не перекрываются.
      - rulex_var:/app/var
    restart: unless-stopped

volumes:
  rulex_var:
