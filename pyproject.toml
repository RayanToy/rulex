[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Устаревшие вызовы в коде приложения — ошибка, в чужих библиотеках — нет
filterwarnings = ['error::DeprecationWarning:app\..*']

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
