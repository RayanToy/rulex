# Миграции схемы БД. Обычно запускаются сами при старте приложения
# (database.migrate), но работают и вручную:
#     alembic upgrade head
#     alembic revision -m "описание"
[alembic]
script_location = migrations
# Адрес базы подставляется из database.DATABASE_URL в migrations/env.py,
# чтобы у приложения и миграций был один источник правды.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
